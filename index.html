<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mietix Anfragen</title>
<style>
:root{--rot:#C4161C;--dunkel:#2E2E30;--rand:#E2E2E4;--grau:#6F6F72;--bg:#F2F2F4;
  --gruen:#1B8A4B;--gelb:#B07400}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--dunkel);padding-bottom:40px;-webkit-text-size-adjust:100%}
header{background:var(--dunkel);color:#fff;border-bottom:3px solid var(--rot);
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px}
header h1{font-size:15px;letter-spacing:1.2px;font-weight:800}
header h1 span{color:var(--rot)}
main{max-width:640px;margin:0 auto;padding:18px 18px 0}
.feldname{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--grau);
  margin:0 0 8px 3px;font-weight:800}
.block{margin-bottom:20px}
.karte{background:#fff;border-radius:20px;padding:17px;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.045)}
label{display:block;font-size:12px;font-weight:700;color:var(--grau);margin:12px 0 5px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--rand);border-radius:16px;
  padding:15px 16px;font:800 18px inherit;color:var(--dunkel);min-height:56px}
textarea{font-weight:400;font-size:16px;min-height:76px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--dunkel);outline-offset:-2px}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;padding:17px;font:800 17px inherit;border:0;border-radius:16px;
  background:var(--rot);color:#fff;margin-top:12px;min-height:56px}
button.hell{background:#fff;color:var(--dunkel);border:1px solid var(--rand)}
.tage{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tag{background:#fff;border-radius:14px;padding:13px 4px;text-align:center;font-weight:800;
  font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.045);cursor:pointer}
.tag.an{background:var(--rot);color:#fff}
.zahlen{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.zahl{background:#fff;border-radius:14px;padding:12px 4px;text-align:center;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.045)}
.zahl b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.zahl i{display:block;font-style:normal;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.6px;color:var(--grau);font-weight:800;margin-top:3px}
.eintrag{background:#fff;border-radius:18px;padding:15px 16px;margin-bottom:10px;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.045);
  border-left:5px solid var(--rand)}
.eintrag.offen{border-left-color:var(--rot)}
.eintrag.angebot{border-left-color:var(--gelb)}
.eintrag.gebucht{border-left-color:var(--gruen)}
.eintrag.abgesagt{border-left-color:#C9C9D2;opacity:.62}
.ekopf{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ename{font-size:18px;font-weight:800;letter-spacing:-.2px}
.ezeit{font-size:12px;color:var(--grau);font-weight:700;flex:none}
.edaten{font-size:14px;color:var(--grau);font-weight:600;margin-top:4px;line-height:1.45}
.ewunsch{font-size:14px;font-weight:700;margin-top:6px}
.enotiz{font-size:13.5px;color:var(--grau);margin-top:6px;line-height:1.45}
.ereihe{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.ereihe.zwei{grid-template-columns:2fr 1fr}
.minik{text-align:center;padding:11px 3px;border-radius:12px;
  font-size:12px;font-weight:800;border:1px solid var(--rand);background:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;min-height:46px;line-height:1.2}
.minik.vertragk{display:block;margin-top:8px;background:var(--rot,#C4161C);color:#fff;border-color:var(--rot,#C4161C);text-decoration:none;font-weight:800}
.minik.linkk{display:block;margin-top:8px;font-weight:700}
.minik.an{background:var(--dunkel);color:#fff;border-color:var(--dunkel)}
.minik.wa{background:#25D366;color:#fff;border-color:#25D366;text-decoration:none;
  display:block;line-height:1.3}
.minik.weg{color:var(--rot)}
.leer{text-align:center;color:var(--grau);font-size:15px;font-weight:600;padding:26px 10px}
footer{max-width:640px;margin:22px auto 0;padding:0 18px;font-size:12px;color:var(--grau);
  line-height:1.55}
</style></head><body>
<header><h1>MIETIX <span>ANFRAGEN</span></h1></header>
<main>
<div id="abgleich" style="margin-top:14px"></div>

<div class="block">
  <p class="feldname">Neue Anfrage</p>
  <div class="karte">
    <div class="zwei">
      <div><label>Name</label><input id="name" type="text" placeholder="Vorname Nachname"></div>
      <div><label>Alter</label><input id="alter" type="number" inputmode="numeric" placeholder="z. B. 27"></div>
    </div>
    <div class="zwei">
      <div><label>Kommt aus</label><input id="ort" type="text" placeholder="z. B. Frankfurt"></div>
      <div><label>WhatsApp</label><input id="nummer" type="tel" inputmode="tel" placeholder="0176 1234567"></div>
    </div>
    <label>Fahrzeugwunsch</label>
    <select id="auto"></select>
    <div class="zwei">
      <div><label>Von</label><input id="von" type="date"></div>
      <div><label>Bis</label><input id="bis" type="date"></div>
    </div>
    <label>Notiz</label>
    <textarea id="notiz" placeholder="z. B. will Samstag abholen, fragt nach Rabatt"></textarea>
    <button id="speichern">Anfrage eintragen</button>
  </div>
</div>

<div class="block">
  <p class="feldname">Übersicht</p>
  <div class="tage" id="tage">
    <div class="tag an" data-w="heute">Heute</div>
    <div class="tag" data-w="gestern">Gestern</div>
    <div class="tag" data-w="alle">Alle</div>
  </div>
  <div class="zahlen" id="zahlen"></div>
  <div id="liste"></div>
</div>

<div class="block">
  <p class="feldname">Tag teilen und sichern</p>
  <div class="karte">
    <button id="tagSenden">Tagesübersicht an WhatsApp</button>
    <button id="ausgeben" class="hell">Alle Anfragen sichern</button>
    <button id="einlesen" class="hell">Gesicherte Anfragen einlesen</button>
    <textarea id="sicherung" placeholder="Hier erscheint die Sicherung, oder hier einfügen zum Einlesen"
      style="margin-top:12px;font-size:13px;min-height:90px"></textarea>
  </div>
</div>

</main>
<footer>
  Mit Anmeldung sind die Anfragen auf allen Geräten gleich (auch beim Bruder).
  Ohne Internet bleibt alles auf dem Handy und gleicht später ab.
</footer>
<script>
const $=id=>document.getElementById(id);
let AUTOS=["Audi RS Q8"];
let SICHT="heute";
const STATUS=[["offen","offen"],["angebot","Angebot"],["gebucht","gebucht"],["abgesagt","abgesagt"]];

function lesen(){ try{ return JSON.parse(localStorage.getItem("mietixAnfragen")||"[]"); }catch(e){ return []; } }
function schreiben(a){ try{ localStorage.setItem("mietixAnfragen",JSON.stringify(a)); }catch(e){} }
function heuteISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")
  +"-"+String(d.getDate()).padStart(2,"0"); }
function gesternISO(){ const d=new Date(); d.setDate(d.getDate()-1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function deutsch(iso){ return iso? iso.split("-").reverse().join("."):""; }
function nummerWa(roh){
  let n=(roh||"").replace(/[^0-9+]/g,"");
  if(!n)return "";
  if(n.startsWith("+"))n=n.slice(1);
  else if(n.startsWith("00"))n=n.slice(2);
  else if(n.startsWith("0"))n="49"+n.slice(1);
  return n.length>=8?n:"";
}

function gefiltert(){
  const a=lesen();
  if(SICHT==="heute")  return a.filter(x=>x.tag===heuteISO());
  if(SICHT==="gestern")return a.filter(x=>x.tag===gesternISO());
  return a;
}

function zeichnen(){
  const liste=gefiltert().slice().reverse();
  const z={offen:0,angebot:0,gebucht:0,abgesagt:0};
  liste.forEach(x=>{ z[x.status]=(z[x.status]||0)+1; });
  $("zahlen").innerHTML=
     '<div class="zahl"><b>'+liste.length+'</b><i>Anfragen</i></div>'
    +'<div class="zahl"><b style="color:var(--rot)">'+z.offen+'</b><i>offen</i></div>'
    +'<div class="zahl"><b style="color:var(--gelb)">'+z.angebot+'</b><i>Angebot</i></div>'
    +'<div class="zahl"><b style="color:var(--gruen)">'+z.gebucht+'</b><i>gebucht</i></div>';

  if(!liste.length){
    $("liste").innerHTML='<div class="leer">Noch keine Anfrage '
      +(SICHT==="alle"?"erfasst.":"an diesem Tag.")+'</div>';
    return;
  }
  $("liste").innerHTML=liste.map(x=>{
    const wa=nummerWa(x.nummer);
    const zeitraum = x.von ? deutsch(x.von)+(x.bis?" bis "+deutsch(x.bis):"") : "";
    return '<div class="eintrag '+x.status+'" data-id="'+x.id+'">'
      +'<div class="ekopf"><span class="ename">'+(x.name||"ohne Namen")+'</span>'
      +'<span class="ezeit">'+x.uhr+(SICHT==="alle"?"  "+deutsch(x.tag):"")+'</span></div>'
      +'<div class="edaten">'+[x.alter?x.alter+" Jahre":"", x.ort||"", x.nummer||""]
            .filter(Boolean).join("  |  ")+'</div>'
      +(x.auto||zeitraum ? '<div class="ewunsch">'+[x.auto,zeitraum].filter(Boolean).join("  |  ")+'</div>':'')
      +(x.notiz? '<div class="enotiz">'+x.notiz+'</div>':'')
      +'<div class="ereihe">'
        +STATUS.map(s=>'<div class="minik '+(x.status===s[0]?"an":"")+'" data-s="'+s[0]+'">'+s[1]+'</div>').join("")
      +'</div>'
      +'<div class="ereihe zwei">'
        +(wa?'<a class="minik wa" href="https://wa.me/'+wa+'" target="_blank">WhatsApp öffnen</a>':'<span></span>')
        +'<div class="minik weg" data-weg="1">Löschen</div>'
      +'</div>'
      // Gebucht: ein Klick öffnet den Mietvertrag schon ausgefüllt (gleicher Speicher auf barankohler.github.io)
      +(x.status==="gebucht"?'<a class="minik vertragk" href="https://barankohler.github.io/mietix-vertrag/?anfrage='+x.id+'">Vertrag machen</a>':'')
      +'</div>';
  }).join("");

  [...$("liste").querySelectorAll(".eintrag")].forEach(e=>{
    const id=e.dataset.id;
    e.querySelectorAll(".minik[data-s]").forEach(k=>{
      k.onclick=()=>{ const a=lesen(); const t=a.find(x=>x.id===id);
        if(t){ t.status=k.dataset.s; schreiben(a); zeichnen(); } };
    });
    const weg=e.querySelector(".minik[data-weg]");
    if(weg) weg.onclick=()=>{ if(!confirm("Diese Anfrage löschen?"))return;
      schreiben(lesen().filter(x=>x.id!==id)); zeichnen(); };
  });
}

$("speichern").onclick=()=>{
  const name=$("name").value.trim();
  const nummer=$("nummer").value.trim();
  if(!name && !nummer){ alert("Bitte wenigstens Name oder Nummer eintragen."); return; }
  const jetzt=new Date();
  const a=lesen();
  a.push({ id:String(Date.now())+Math.random().toString(36).slice(2,6),
    tag:heuteISO(), uhr:String(jetzt.getHours()).padStart(2,"0")+":"+String(jetzt.getMinutes()).padStart(2,"0"),
    name:name, alter:$("alter").value.trim(), ort:$("ort").value.trim(), nummer:nummer,
    auto:$("auto").value, von:$("von").value, bis:$("bis").value,
    notiz:$("notiz").value.trim(), status:"offen" });
  schreiben(a);
  ["name","alter","ort","nummer","von","bis","notiz"].forEach(k=>$(k).value="");
  SICHT="heute";
  [...$("tage").querySelectorAll(".tag")].forEach(t=>t.classList.toggle("an",t.dataset.w==="heute"));
  zeichnen();
  $("speichern").textContent="Eingetragen";
  setTimeout(()=>{$("speichern").textContent="Anfrage eintragen";},1400);
  window.scrollTo({top:document.body.scrollHeight/2,behavior:"smooth"});
};

[...$("tage").querySelectorAll(".tag")].forEach(t=>{
  t.onclick=()=>{ SICHT=t.dataset.w;
    [...$("tage").querySelectorAll(".tag")].forEach(x=>x.classList.remove("an"));
    t.classList.add("an"); zeichnen(); };
});

function tagesText(){
  const liste=gefiltert().slice().reverse();
  const titel = SICHT==="heute"?"Anfragen heute" : SICHT==="gestern"?"Anfragen gestern":"Alle Anfragen";
  if(!liste.length) return "*"+titel+"*\n\nKeine Anfragen.";
  const z={offen:0,angebot:0,gebucht:0,abgesagt:0};
  liste.forEach(x=>{ z[x.status]=(z[x.status]||0)+1; });
  let t="*"+titel+", "+deutsch(SICHT==="gestern"?gesternISO():heuteISO())+"*\n\n";
  t+=liste.length+" gesamt, "+z.offen+" offen, "+z.angebot+" Angebot raus, "
    +z.gebucht+" gebucht, "+z.abgesagt+" abgesagt\n\n";
  liste.forEach(x=>{
    const zr = x.von ? deutsch(x.von)+(x.bis?" bis "+deutsch(x.bis):"") : "";
    t+="- "+x.uhr+"  "+(x.name||"ohne Namen")
      +(x.alter?", "+x.alter+" Jahre":"")+(x.ort?", "+x.ort:"")+"\n";
    if(x.nummer) t+="  "+x.nummer+"\n";
    if(x.auto||zr) t+="  "+[x.auto,zr].filter(Boolean).join(", ")+"\n";
    t+="  Stand: "+(STATUS.find(s=>s[0]===x.status)||["","offen"])[1]+"\n";
    if(x.notiz) t+="  "+x.notiz+"\n";
  });
  return t;
}
$("tagSenden").onclick=()=>{
  window.open("https://wa.me/?text="+encodeURIComponent(tagesText()),"_blank");
};
$("ausgeben").onclick=()=>{
  $("sicherung").value=JSON.stringify(lesen());
  $("ausgeben").textContent="Unten steht die Sicherung";
  setTimeout(()=>{$("ausgeben").textContent="Alle Anfragen sichern";},1800);
};
$("einlesen").onclick=()=>{
  let neu=null;
  try{ neu=JSON.parse($("sicherung").value); }catch(e){}
  if(!Array.isArray(neu)){ alert("Da steht keine gültige Sicherung."); return; }
  const a=lesen(), bekannt=new Set(a.map(x=>x.id));
  let dazu=0;
  neu.forEach(x=>{ if(x&&x.id&&!bekannt.has(x.id)){ a.push(x); dazu++; } });
  a.sort((p,q)=>(p.tag+p.uhr).localeCompare(q.tag+q.uhr));
  schreiben(a); zeichnen();
  alert(dazu+(dazu===1?" Anfrage":" Anfragen")+" dazugekommen.");
};

function autosFuellen(){
  const vorher=$("auto").value;
  $("auto").innerHTML='<option value="">noch offen</option>'
    +AUTOS.map(n=>'<option>'+n+'</option>').join("");
  if(vorher) $("auto").value=vorher;
}
autosFuellen(); zeichnen();
try{
  fetch("https://barankohler.github.io/mietix-preise/preise.json",{cache:"no-store"})
    .then(r=>r.ok?r.json():null)
    .then(p=>{ if(p&&p.cars&&p.cars.length){ AUTOS=p.cars.map(c=>c.anzeige||c.n); autosFuellen(); } })
    .catch(()=>{});
}catch(e){}
window.addEventListener("mietix-abgleich",()=>zeichnen());   // neuer Stand von einem anderen Gerät
</script>
<script>/* Mietix Abgleich: Verträge, Anfragen, Kunden und Fahrzeuge auf allen Geräten gleich (Supabase Frankfurt, seit 26.10.2026).
   Wird von tools/vertrag/build_html.py und tools/anfragen/build_html.py in die Seite eingebaut.
   - Die Werkzeuge arbeiten weiter nur mit localStorage. Dieser Baustein merkt jede Änderung an den vier Speichern,
     schickt sie hoch und holt neue Stände der anderen Geräte (beim Start, beim Zurückkehren zur Seite, jede Minute).
   - Ohne Internet oder ohne Anmeldung läuft alles wie vorher, der Abgleich holt später nach.
   - Gelöschte Einträge (Anfragen-Buch) gehen als {_weg:true} hoch, damit sie auch auf den anderen Geräten verschwinden.
   - Anmeldung: E-Mail und Passwort, einmal pro Gerät. Gilt für alle Mietix-Werkzeuge auf barankohler.github.io. */
(function(){
const URL_="https://zbeqrwvlmiulxvhryiku.supabase.co";
const KEY="sb_publishable_LVkvpgXMpBbq_OXgwOfTqg_ZRcRkFyQ";   // öffentlich gedacht, Schutz über Anmeldung und Regeln in der Datenbank
const SPEICHER={mietixVorgaenge:{tab:"vorgaenge",pk:"nr",liste:true},mietixAnfragen:{tab:"anfragen",pk:"id",liste:true},
  mietixKunden:{tab:"kunden",pk:"name",liste:false},mietixFahrzeuge:{tab:"fahrzeuge",pk:"name",liste:false}};
const roh=Storage.prototype.setItem;
const lies=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"")||d}catch(e){return d}};
const merk=(k,v)=>{try{roh.call(localStorage,k,JSON.stringify(v))}catch(e){}};
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)};
let sitzung=lies("mietixSitzung",null),laeuft=false,nochmal=false,zuletzt=null,fehler="";

/* ---------- Anmeldung ---------- */
async function auth(pfad,body){const r=await fetch(URL_+"/auth/v1/"+pfad,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||j.message||"Anmeldung fehlgeschlagen");return j}
function sichern(j){sitzung={token:j.access_token,neu:j.refresh_token,bis:Date.now()+(j.expires_in||3600)*1000-60000,
  email:(j.user&&j.user.email)||(sitzung&&sitzung.email)||""};merk("mietixSitzung",sitzung)}
async function token(){if(!sitzung)return null;
  if(Date.now()>sitzung.bis){try{sichern(await auth("token?grant_type=refresh_token",{refresh_token:sitzung.neu}))}
    catch(e){if(navigator.onLine){sitzung=null;localStorage.removeItem("mietixSitzung");zeigen()}return null}}
  return sitzung.token}
async function api(pfad,opt){const t=await token();if(!t)throw new Error("nicht angemeldet");
  const r=await fetch(URL_+"/rest/v1/"+pfad,Object.assign({},opt,{headers:Object.assign({apikey:KEY,Authorization:"Bearer "+t,"Content-Type":"application/json"},(opt||{}).headers||{})}));
  if(!r.ok)throw new Error("Speicher antwortet "+r.status);const s=await r.text();return s?JSON.parse(s):null}

/* ---------- Abgleich ---------- */
function alsMap(k,w){const c=SPEICHER[k],m={};if(c.liste)(w||[]).forEach(x=>{if(x&&x[c.pk]!==undefined)m[String(x[c.pk])]=x});else Object.assign(m,w||{});return m}
function ausMap(k,m){const c=SPEICHER[k];if(!c.liste)return m;return Object.keys(m).sort().map(p=>m[p])}
async function abgleichen(){
  if(!sitzung||!navigator.onLine)return;if(laeuft){nochmal=true;return}laeuft=true;fehler="";zeigen();
  const H=lies("mietixAbgleich",{}),geholt=[];
  try{
    for(const k of Object.keys(SPEICHER)){const c=SPEICHER[k],h=H[k]=H[k]||{zeit:"",hash:{}},m=alsMap(k,lies(k,c.liste?[]:{}));
      // 1) hoch: alles, was sich hier seit dem letzten Abgleich geändert hat (auch Gelöschtes)
      const jetzt=new Date().toISOString(),hoch=[];
      Object.keys(m).forEach(p=>{const s=JSON.stringify(m[p]);if(h.hash[p]!==hash(s))hoch.push({[c.pk]:p,daten:m[p],geaendert:jetzt})});
      Object.keys(h.hash).forEach(p=>{if(!(p in m)&&h.hash[p]!=="weg")hoch.push({[c.pk]:p,daten:{_weg:true},geaendert:jetzt})});
      for(let i=0;i<hoch.length;i+=200)await api(c.tab+"?on_conflict="+c.pk,{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify(hoch.slice(i,i+200))});
      hoch.forEach(z=>h.hash[z[c.pk]]=z.daten._weg?"weg":hash(JSON.stringify(z.daten)));
      if(k==="mietixVorgaenge"){const max=Math.max(0,...Object.keys(m).filter(n=>/^\d{6}$/.test(n)).map(Number));
        if(max)await api("rpc/vertragsnummer_mindestens",{method:"POST",body:JSON.stringify({n:max})})}
      // 2) runter: was die anderen Geräte seit dem letzten Mal geschickt haben
      const seit=h.zeit?"&geaendert=gt."+encodeURIComponent(h.zeit):"";
      const zeilen=await api(c.tab+"?select="+c.pk+",daten,geaendert&order=geaendert.asc"+seit,{method:"GET"})||[];
      let anders=false;const m2=alsMap(k,lies(k,c.liste?[]:{}));
      zeilen.forEach(z=>{const p=String(z[c.pk]);h.zeit=z.geaendert>h.zeit?z.geaendert:h.zeit;
        if(z.daten&&z.daten._weg){if(p in m2){delete m2[p];anders=true}h.hash[p]="weg";return}
        const s=JSON.stringify(z.daten);if(!(p in m2)||JSON.stringify(m2[p])!==s){m2[p]=z.daten;anders=true}h.hash[p]=hash(s)});
      if(anders){merk(k,ausMap(k,m2));geholt.push(k)}}
    merk("mietixAbgleich",H);zuletzt=new Date();
    if(geholt.length)window.dispatchEvent(new CustomEvent("mietix-abgleich",{detail:geholt}));
  }catch(e){fehler=e.message||"Abgleich fehlgeschlagen"}
  laeuft=false;zeigen();if(nochmal){nochmal=false;setTimeout(abgleichen,500)}}
// Jede Änderung an den vier Speichern löst kurz danach einen Abgleich aus
let warte=null;
Storage.prototype.setItem=function(k,v){roh.call(this,k,v);if(this===localStorage&&SPEICHER[k]){clearTimeout(warte);warte=setTimeout(abgleichen,800)}};

/* ---------- Vertragsnummer aus dem gemeinsamen Speicher ---------- */
window.mietixNeueNummer=async function(){if(!sitzung||!navigator.onLine)return null;
  try{const n=await api("rpc/neue_vertragsnummer",{method:"POST",body:"{}"});return typeof n==="string"?n:null}catch(e){return null}};
window.mietixAbgleichen=abgleichen;

/* ---------- Link aus der Einladungs- oder Passwort-Mail: Passwort selbst festlegen ---------- */
let pwSetzen=false,linkFehler="";
(function(){const h=new URLSearchParams(location.hash.slice(1));if(!h.get("access_token")&&!h.get("error"))return;
  history.replaceState(null,"",location.pathname+location.search);
  if(h.get("error")){linkFehler="Der Link aus der Mail ist abgelaufen oder schon benutzt. Bitte eine neue Einladung anfordern.";return}
  sichern({access_token:h.get("access_token"),refresh_token:h.get("refresh_token"),expires_in:+h.get("expires_in")||3600});
  pwSetzen=/invite|recovery|signup/.test(h.get("type")||"")})();

/* ---------- Anzeige: Anmeldung oder Stand ---------- */
function zeigen(){const el=document.getElementById("abgleich");if(!el)return;
  if(sitzung&&pwSetzen){el.innerHTML='<div class="abgl"><b>Passwort festlegen</b><div class="abgl-text">Damit meldest du dich auf deinen Geräten an. Mindestens 8 Zeichen.</div>'+
    '<input id="ablNeu" type="password" autocomplete="new-password" placeholder="Neues Passwort">'+
    '<button id="ablSetzen" type="button">Passwort speichern</button><div class="abgl-fehler" id="ablFehler"></div></div>';
    document.getElementById("ablSetzen").onclick=async()=>{const pw=document.getElementById("ablNeu").value,f=document.getElementById("ablFehler");
      if(pw.length<8){f.textContent="Bitte mindestens 8 Zeichen.";return}
      try{const t=await token();const r=await fetch(URL_+"/auth/v1/user",{method:"PUT",headers:{apikey:KEY,Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({password:pw})});
        if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.msg||j.message||"Speichern ging nicht")}
        pwSetzen=false;zeigen();abgleichen()}catch(e){f.textContent=e.message}};return}
  const pkt=document.getElementById("abgleichPunkt");
  if(pkt)pkt.style.background=!sitzung?"#B0B0B3":fehler?"#C4161C":"#1B8A4B";
  if(!sitzung){el.innerHTML='<div class="abgl"><b>Geräte abgleichen</b><div class="abgl-text">Einmal anmelden, dann sind Verträge und Anfragen auf allen Geräten gleich.</div>'+
    '<input id="ablMail" type="email" inputmode="email" autocomplete="username" placeholder="E-Mail">'+
    '<input id="ablPw" type="password" autocomplete="current-password" placeholder="Passwort">'+
    '<button id="ablLos" type="button">Anmelden</button><div class="abgl-fehler" id="ablFehler">'+linkFehler+'</div>'+
    '<a href="#" id="ablNeuZugang" class="abgl-link">Noch keinen Zugang? Hier anlegen</a></div>';
    const mail=()=>document.getElementById("ablMail").value.trim(),pw=()=>document.getElementById("ablPw").value,f=document.getElementById("ablFehler");
    document.getElementById("ablLos").onclick=async()=>{f.textContent="";
      try{sichern(await auth("token?grant_type=password",{email:mail(),password:pw()}));
        zeigen();abgleichen()}catch(e){f.textContent=/Invalid login/i.test(e.message)?"E-Mail oder Passwort stimmt nicht.":e.message}};
    // Zugang selbst anlegen: geht nur, solange Baran die Registrierung in Supabase kurz freigibt
    document.getElementById("ablNeuZugang").onclick=async e=>{e.preventDefault();f.textContent="";
      if(!mail()||pw().length<8){f.textContent="Oben E-Mail und ein eigenes Passwort (mindestens 8 Zeichen) eintragen, dann hier tippen.";return}
      try{const j=await auth("signup",{email:mail(),password:pw()});
        if(j.access_token){sichern(j);zeigen();abgleichen()}else f.textContent="Zugang angelegt. Bitte die Mail bestätigen und dann anmelden."}
      catch(e){f.textContent=/not allowed|disabled/i.test(e.message)?"Zugang anlegen ist gerade gesperrt. Baran muss es kurz freigeben.":
        /already/i.test(e.message)?"Für diese E-Mail gibt es schon einen Zugang. Bitte oben anmelden.":e.message}};return}
  const stand=laeuft?"gleicht ab …":fehler?"nicht abgeglichen: "+fehler:zuletzt?"abgeglichen um "+String(zuletzt.getHours()).padStart(2,"0")+":"+String(zuletzt.getMinutes()).padStart(2,"0"):"wartet auf Internet";
  el.innerHTML='<div class="abgl klein"><span>Alle Geräte: '+stand+'</span><a href="#" id="ablAus">abmelden</a></div>';
  document.getElementById("ablAus").onclick=e=>{e.preventDefault();if(!confirm("Auf diesem Gerät abmelden? Die Daten bleiben hier."))return;
    sitzung=null;localStorage.removeItem("mietixSitzung");zeigen()}}
const css=document.createElement("style");
css.textContent=".abgl{background:#fff;border:1px solid #E4E4E7;border-radius:16px;padding:14px;margin-bottom:14px}"+
  ".abgl b{display:block;font-size:15px;margin-bottom:4px}.abgl-text{font-size:13px;color:#6F6F72;margin-bottom:8px}"+
  ".abgl input{width:100%;border:1px solid #E4E4E7;border-radius:12px;padding:12px;font:600 16px inherit;margin-top:6px;min-height:46px;box-sizing:border-box}"+
  ".abgl button{width:100%;margin-top:8px;background:#C4161C;color:#fff;border:0;border-radius:12px;padding:13px;font:800 16px inherit;cursor:pointer}"+
  ".abgl-fehler{color:#C4161C;font-size:13px;font-weight:700;margin-top:6px}"+

document.head.appendChild(css);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)abgleichen()});
window.addEventListener("online",abgleichen);
setInterval(abgleichen,60000);
zeigen();abgleichen();
})();
