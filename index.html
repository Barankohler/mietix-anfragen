<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mietix Anfragen</title>
<style>
:root{--rot:#C4161C;--dunkel:#2E2E30;--rand:#E2E2E4;--grau:#6F6F72;--bg:#F2F2F4;
  --gruen:#1B8A4B;--gelb:#B07400}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--dunkel);padding-bottom:40px;-webkit-text-size-adjust:100%}
header{background:var(--dunkel);color:#fff;border-bottom:3px solid var(--rot);
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px}
header h1{font-size:15px;letter-spacing:1.2px;font-weight:800}
header h1 span{color:var(--rot)}
main{max-width:640px;margin:0 auto;padding:18px 18px 0}
.feldname{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--grau);
  margin:0 0 8px 3px;font-weight:800}
.block{margin-bottom:20px}
.karte{background:#fff;border-radius:20px;padding:17px;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.045)}
label{display:block;font-size:12px;font-weight:700;color:var(--grau);margin:12px 0 5px}
label:first-child{margin-top:0}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--rand);border-radius:16px;
  padding:15px 16px;font:800 18px inherit;color:var(--dunkel);min-height:56px}
textarea{font-weight:400;font-size:16px;min-height:76px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--dunkel);outline-offset:-2px}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{width:100%;padding:17px;font:800 17px inherit;border:0;border-radius:16px;
  background:var(--rot);color:#fff;margin-top:12px;min-height:56px}
button.hell{background:#fff;color:var(--dunkel);border:1px solid var(--rand)}
.tage{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.tag{background:#fff;border-radius:14px;padding:13px 4px;text-align:center;font-weight:800;
  font-size:15px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.045);cursor:pointer}
.tag.an{background:var(--rot);color:#fff}
.zahlen{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.zahl{background:#fff;border-radius:14px;padding:12px 4px;text-align:center;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.045)}
.zahl b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.zahl i{display:block;font-style:normal;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.6px;color:var(--grau);font-weight:800;margin-top:3px}
.eintrag{background:#fff;border-radius:18px;padding:15px 16px;margin-bottom:10px;
  box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.045);
  border-left:5px solid var(--rand)}
.eintrag.offen{border-left-color:var(--rot)}
.eintrag.angebot{border-left-color:var(--gelb)}
.eintrag.gebucht{border-left-color:var(--gruen)}
.eintrag.abgesagt{border-left-color:#C9C9D2;opacity:.62}
.ekopf{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ename{font-size:18px;font-weight:800;letter-spacing:-.2px}
.ezeit{font-size:12px;color:var(--grau);font-weight:700;flex:none}
.edaten{font-size:14px;color:var(--grau);font-weight:600;margin-top:4px;line-height:1.45}
.ewunsch{font-size:14px;font-weight:700;margin-top:6px}
.enotiz{font-size:13.5px;color:var(--grau);margin-top:6px;line-height:1.45}
.ereihe{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.ereihe.zwei{grid-template-columns:2fr 1fr}
.minik{text-align:center;padding:11px 3px;border-radius:12px;
  font-size:12px;font-weight:800;border:1px solid var(--rand);background:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;min-height:46px;line-height:1.2}
.minik.an{background:var(--dunkel);color:#fff;border-color:var(--dunkel)}
.minik.wa{background:#25D366;color:#fff;border-color:#25D366;text-decoration:none;
  display:block;line-height:1.3}
.minik.weg{color:var(--rot)}
.leer{text-align:center;color:var(--grau);font-size:15px;font-weight:600;padding:26px 10px}
footer{max-width:640px;margin:22px auto 0;padding:0 18px;font-size:12px;color:var(--grau);
  line-height:1.55}
</style></head><body>
<header><h1>MIETIX <span>ANFRAGEN</span></h1></header>
<main>

<div class="block">
  <p class="feldname">Neue Anfrage</p>
  <div class="karte">
    <div class="zwei">
      <div><label>Name</label><input id="name" type="text" placeholder="Vorname Nachname"></div>
      <div><label>Alter</label><input id="alter" type="number" inputmode="numeric" placeholder="z. B. 27"></div>
    </div>
    <div class="zwei">
      <div><label>Kommt aus</label><input id="ort" type="text" placeholder="z. B. Frankfurt"></div>
      <div><label>WhatsApp</label><input id="nummer" type="tel" inputmode="tel" placeholder="0176 1234567"></div>
    </div>
    <label>Fahrzeugwunsch</label>
    <select id="auto"></select>
    <div class="zwei">
      <div><label>Von</label><input id="von" type="date"></div>
      <div><label>Bis</label><input id="bis" type="date"></div>
    </div>
    <label>Notiz</label>
    <textarea id="notiz" placeholder="z. B. will Samstag abholen, fragt nach Rabatt"></textarea>
    <button id="speichern">Anfrage eintragen</button>
  </div>
</div>

<div class="block">
  <p class="feldname">Übersicht</p>
  <div class="tage" id="tage">
    <div class="tag an" data-w="heute">Heute</div>
    <div class="tag" data-w="gestern">Gestern</div>
    <div class="tag" data-w="alle">Alle</div>
  </div>
  <div class="zahlen" id="zahlen"></div>
  <div id="liste"></div>
</div>

<div class="block">
  <p class="feldname">Tag teilen und sichern</p>
  <div class="karte">
    <button id="tagSenden">Tagesübersicht an WhatsApp</button>
    <button id="ausgeben" class="hell">Alle Anfragen sichern</button>
    <button id="einlesen" class="hell">Gesicherte Anfragen einlesen</button>
    <textarea id="sicherung" placeholder="Hier erscheint die Sicherung, oder hier einfügen zum Einlesen"
      style="margin-top:12px;font-size:13px;min-height:90px"></textarea>
  </div>
</div>

</main>
<footer>
  Die Anfragen liegen auf diesem Handy. Damit Ihr Bruder denselben Stand hat,
  schicken Sie ihm abends die Tagesübersicht oder die Sicherung.
</footer>
<script>
const $=id=>document.getElementById(id);
let AUTOS=["Audi RS Q8"];
let SICHT="heute";
const STATUS=[["offen","offen"],["angebot","Angebot"],["gebucht","gebucht"],["abgesagt","abgesagt"]];

function lesen(){ try{ return JSON.parse(localStorage.getItem("mietixAnfragen")||"[]"); }catch(e){ return []; } }
function schreiben(a){ try{ localStorage.setItem("mietixAnfragen",JSON.stringify(a)); }catch(e){} }
function heuteISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")
  +"-"+String(d.getDate()).padStart(2,"0"); }
function gesternISO(){ const d=new Date(); d.setDate(d.getDate()-1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function deutsch(iso){ return iso? iso.split("-").reverse().join("."):""; }
function nummerWa(roh){
  let n=(roh||"").replace(/[^0-9+]/g,"");
  if(!n)return "";
  if(n.startsWith("+"))n=n.slice(1);
  else if(n.startsWith("00"))n=n.slice(2);
  else if(n.startsWith("0"))n="49"+n.slice(1);
  return n.length>=8?n:"";
}

function gefiltert(){
  const a=lesen();
  if(SICHT==="heute")  return a.filter(x=>x.tag===heuteISO());
  if(SICHT==="gestern")return a.filter(x=>x.tag===gesternISO());
  return a;
}

function zeichnen(){
  const liste=gefiltert().slice().reverse();
  const z={offen:0,angebot:0,gebucht:0,abgesagt:0};
  liste.forEach(x=>{ z[x.status]=(z[x.status]||0)+1; });
  $("zahlen").innerHTML=
     '<div class="zahl"><b>'+liste.length+'</b><i>Anfragen</i></div>'
    +'<div class="zahl"><b style="color:var(--rot)">'+z.offen+'</b><i>offen</i></div>'
    +'<div class="zahl"><b style="color:var(--gelb)">'+z.angebot+'</b><i>Angebot</i></div>'
    +'<div class="zahl"><b style="color:var(--gruen)">'+z.gebucht+'</b><i>gebucht</i></div>';

  if(!liste.length){
    $("liste").innerHTML='<div class="leer">Noch keine Anfrage '
      +(SICHT==="alle"?"erfasst.":"an diesem Tag.")+'</div>';
    return;
  }
  $("liste").innerHTML=liste.map(x=>{
    const wa=nummerWa(x.nummer);
    const zeitraum = x.von ? deutsch(x.von)+(x.bis?" bis "+deutsch(x.bis):"") : "";
    return '<div class="eintrag '+x.status+'" data-id="'+x.id+'">'
      +'<div class="ekopf"><span class="ename">'+(x.name||"ohne Namen")+'</span>'
      +'<span class="ezeit">'+x.uhr+(SICHT==="alle"?"  "+deutsch(x.tag):"")+'</span></div>'
      +'<div class="edaten">'+[x.alter?x.alter+" Jahre":"", x.ort||"", x.nummer||""]
            .filter(Boolean).join("  |  ")+'</div>'
      +(x.auto||zeitraum ? '<div class="ewunsch">'+[x.auto,zeitraum].filter(Boolean).join("  |  ")+'</div>':'')
      +(x.notiz? '<div class="enotiz">'+x.notiz+'</div>':'')
      +'<div class="ereihe">'
        +STATUS.map(s=>'<div class="minik '+(x.status===s[0]?"an":"")+'" data-s="'+s[0]+'">'+s[1]+'</div>').join("")
      +'</div>'
      +'<div class="ereihe zwei">'
        +(wa?'<a class="minik wa" href="https://wa.me/'+wa+'" target="_blank">WhatsApp öffnen</a>':'<span></span>')
        +'<div class="minik weg" data-weg="1">Löschen</div>'
      +'</div></div>';
  }).join("");

  [...$("liste").querySelectorAll(".eintrag")].forEach(e=>{
    const id=e.dataset.id;
    e.querySelectorAll(".minik[data-s]").forEach(k=>{
      k.onclick=()=>{ const a=lesen(); const t=a.find(x=>x.id===id);
        if(t){ t.status=k.dataset.s; schreiben(a); zeichnen(); } };
    });
    const weg=e.querySelector(".minik[data-weg]");
    if(weg) weg.onclick=()=>{ if(!confirm("Diese Anfrage löschen?"))return;
      schreiben(lesen().filter(x=>x.id!==id)); zeichnen(); };
  });
}

$("speichern").onclick=()=>{
  const name=$("name").value.trim();
  const nummer=$("nummer").value.trim();
  if(!name && !nummer){ alert("Bitte wenigstens Name oder Nummer eintragen."); return; }
  const jetzt=new Date();
  const a=lesen();
  a.push({ id:String(Date.now())+Math.random().toString(36).slice(2,6),
    tag:heuteISO(), uhr:String(jetzt.getHours()).padStart(2,"0")+":"+String(jetzt.getMinutes()).padStart(2,"0"),
    name:name, alter:$("alter").value.trim(), ort:$("ort").value.trim(), nummer:nummer,
    auto:$("auto").value, von:$("von").value, bis:$("bis").value,
    notiz:$("notiz").value.trim(), status:"offen" });
  schreiben(a);
  ["name","alter","ort","nummer","von","bis","notiz"].forEach(k=>$(k).value="");
  SICHT="heute";
  [...$("tage").querySelectorAll(".tag")].forEach(t=>t.classList.toggle("an",t.dataset.w==="heute"));
  zeichnen();
  $("speichern").textContent="Eingetragen";
  setTimeout(()=>{$("speichern").textContent="Anfrage eintragen";},1400);
  window.scrollTo({top:document.body.scrollHeight/2,behavior:"smooth"});
};

[...$("tage").querySelectorAll(".tag")].forEach(t=>{
  t.onclick=()=>{ SICHT=t.dataset.w;
    [...$("tage").querySelectorAll(".tag")].forEach(x=>x.classList.remove("an"));
    t.classList.add("an"); zeichnen(); };
});

function tagesText(){
  const liste=gefiltert().slice().reverse();
  const titel = SICHT==="heute"?"Anfragen heute" : SICHT==="gestern"?"Anfragen gestern":"Alle Anfragen";
  if(!liste.length) return "*"+titel+"*\n\nKeine Anfragen.";
  const z={offen:0,angebot:0,gebucht:0,abgesagt:0};
  liste.forEach(x=>{ z[x.status]=(z[x.status]||0)+1; });
  let t="*"+titel+", "+deutsch(SICHT==="gestern"?gesternISO():heuteISO())+"*\n\n";
  t+=liste.length+" gesamt, "+z.offen+" offen, "+z.angebot+" Angebot raus, "
    +z.gebucht+" gebucht, "+z.abgesagt+" abgesagt\n\n";
  liste.forEach(x=>{
    const zr = x.von ? deutsch(x.von)+(x.bis?" bis "+deutsch(x.bis):"") : "";
    t+="- "+x.uhr+"  "+(x.name||"ohne Namen")
      +(x.alter?", "+x.alter+" Jahre":"")+(x.ort?", "+x.ort:"")+"\n";
    if(x.nummer) t+="  "+x.nummer+"\n";
    if(x.auto||zr) t+="  "+[x.auto,zr].filter(Boolean).join(", ")+"\n";
    t+="  Stand: "+(STATUS.find(s=>s[0]===x.status)||["","offen"])[1]+"\n";
    if(x.notiz) t+="  "+x.notiz+"\n";
  });
  return t;
}
$("tagSenden").onclick=()=>{
  window.open("https://wa.me/?text="+encodeURIComponent(tagesText()),"_blank");
};
$("ausgeben").onclick=()=>{
  $("sicherung").value=JSON.stringify(lesen());
  $("ausgeben").textContent="Unten steht die Sicherung";
  setTimeout(()=>{$("ausgeben").textContent="Alle Anfragen sichern";},1800);
};
$("einlesen").onclick=()=>{
  let neu=null;
  try{ neu=JSON.parse($("sicherung").value); }catch(e){}
  if(!Array.isArray(neu)){ alert("Da steht keine gültige Sicherung."); return; }
  const a=lesen(), bekannt=new Set(a.map(x=>x.id));
  let dazu=0;
  neu.forEach(x=>{ if(x&&x.id&&!bekannt.has(x.id)){ a.push(x); dazu++; } });
  a.sort((p,q)=>(p.tag+p.uhr).localeCompare(q.tag+q.uhr));
  schreiben(a); zeichnen();
  alert(dazu+(dazu===1?" Anfrage":" Anfragen")+" dazugekommen.");
};

function autosFuellen(){
  const vorher=$("auto").value;
  $("auto").innerHTML='<option value="">noch offen</option>'
    +AUTOS.map(n=>'<option>'+n+'</option>').join("");
  if(vorher) $("auto").value=vorher;
}
autosFuellen(); zeichnen();
try{
  fetch("https://barankohler.github.io/mietix-preise/preise.json",{cache:"no-store"})
    .then(r=>r.ok?r.json():null)
    .then(p=>{ if(p&&p.cars&&p.cars.length){ AUTOS=p.cars.map(c=>c.anzeige||c.n); autosFuellen(); } })
    .catch(()=>{});
}catch(e){}
</script></body></html>
